<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment - KUMBHARBAJAR</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <img src="images/logo.png" alt="KUMBHARBAJAR Logo" class="logo-image">
                <h2>KUMBHARBAJAR</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#products">Products</a></li>
            </ul>
        </div>
    </nav>

    <div class="section-container" style="padding-top:7rem; min-height:80vh;">
        <div class="section-header">
            <h2>Secure Payment Gateway</h2>
            <p>100% Safe & Encrypted Payment for Authentic Pottery</p>
        </div>

        <div style="max-width:500px; margin:0 auto; background:#FFF; padding:2rem; border-radius:12px; border:1px solid var(--border-color); text-align:center;">
            <i class="fas fa-shield-alt fa-3x" style="color:var(--primary-color); margin-bottom:1rem;"></i>
            <h3>UPI / Online Payment</h3>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">Orders placed via Kumbhar Bazar support local master potters directly.</p>
            <button onclick="window.location.href='dashboard.html'" class="auth-submit-btn">
                View My Orders <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
